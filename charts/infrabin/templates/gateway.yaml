{{- if and .Values.istio.enabled .Values.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ include "infrabin.fullname" . }}-gateway
  namespace: infrabin
spec:
  selector:
    istio: gateway
  servers:
    - port:
        number: {{ .Values.istio.gateway.port }}
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.istio.gateway.host }}
{{- end }}
