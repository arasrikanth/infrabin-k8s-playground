{{- if and .Values.istio.enabled .Values.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "infrabin.fullname" . }}-vs
  namespace: infrabin
spec:
  hosts:
    - {{ .Values.istio.gateway.host }}
  gateways:
    - {{ include "infrabin.fullname" . }}-gateway
  http:
    - route:
        - destination:
            host: {{ include "infrabin.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
