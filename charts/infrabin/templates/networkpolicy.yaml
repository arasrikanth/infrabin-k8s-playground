{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "infrabin.fullname" . }}-policy
spec:
  podSelector:
    matchLabels:
      app: {{ include "infrabin.name" . }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # allow from Istio ingressgateway
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.networkPolicy.istioNamespace }}
        # allow Prometheus
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.networkPolicy.prometheusNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
